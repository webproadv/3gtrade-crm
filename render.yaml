# Pubblicazione su Render (https://render.com) con server in Europa (Francoforte).
# Da Render: New → Blueprint → scegli il repository. Vedi PUBBLICAZIONE-ONLINE.md.
services:
  - type: web
    name: 3gtrade-crm
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb        # il più piccolo a pagamento, 7 $/mese: sempre acceso
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true        # ogni modifica unita su main viene pubblicata
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: 3gtrade-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      # Azienda e amministratore creati al primo avvio (chiesti da Render alla creazione)
      - key: INIT_TENANT_SLUG
        sync: false
      - key: INIT_TENANT_NAME
        sync: false
      - key: INIT_ADMIN_EMAIL
        sync: false
      - key: INIT_ADMIN_PASSWORD
        sync: false
      # Server di posta per le email del CRM (facoltativo, si può impostare anche dopo).
      # Esempio: smtps://utente%40dominio.it:password@smtp.dominio.it:465
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: 3gtrade-crm-db
    region: frankfurt
    # il più piccolo a pagamento, 6 $/mese + 0,30 $/mese per GB di spazio.
    # Il database gratuito non è adatto: viene cancellato dopo 30 giorni e non ha backup.
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: crm
    user: crm
    ipAllowList: []         # raggiungibile solo dai servizi Render
