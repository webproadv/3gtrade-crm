name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://crm:crm@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - name: Crea utente applicativo (non superuser) e database di test
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f scripts/init-db.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/api run typecheck
      - run: npm --prefix apps/api test
      - run: npm --prefix apps/web run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avvia il CRM completo con docker compose
        run: docker compose up -d --build --wait
      - name: Verifica che API e interfaccia rispondano
        run: |
          curl -fs http://localhost:8080/api/health
          curl -fs http://localhost:8080/ | grep -q "3Gtrade CRM"
          curl -fs -X POST http://localhost:8080/api/auth/login -H 'content-type: application/json' \
            -d '{"tenant":"demo","email":"admin@3gtrade.local","password":"demo1234"}' | grep -q accessToken
      - name: Log in caso di errore
        if: failure()
        run: docker compose logs
